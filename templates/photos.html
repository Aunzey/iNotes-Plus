<html>

<head>
    {{template "head" .}}
    <meta name="description" content="{{or .Post.Abstract .Post.Title}}" />
</head>

<body>
    <div class="main">
        <div class="main-content">
            {{template "header" .}}

            <div class="post-detail">
                <article class="post">
                    <h2 class="post-title">{{.Post.Title}}</h2>
                    <div class="post-info">
                        <span>{{.Post.DateFormat}}</span>
                        {{with .Post.Tags}}
                        <span>
                            {{range .}}
                            <a href="{{.Link}}" class="post-tag"># {{.Name}}</a>
                            {{end}}
                        </span>
                        {{end}}
                    </div>

                    <div class="photos-intro post-content" v-pre>
                        {{.Post.Content}}
                    </div>

                    {{template "photo-masonry" .}}
                </article>
            </div>

            {{template "footer" .}}
        </div>
    </div>
</body>

</html>
